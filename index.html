    <!-- Custom JS -->
    <script>
        // Back to Top Button
        const backToTopBtn = document.getElementById('backToTop');
        const navbar = document.querySelector('.navbar');
        let lastScrollTop = 0;

        window.addEventListener('scroll', function() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

            // Show/Hide Back to Top button
            if (scrollTop > 300) {
                backToTopBtn.classList.add('visible');
            } else {
                backToTopBtn.classList.remove('visible');
            }

            // Hide/Show Navbar on scroll
            if (scrollTop > lastScrollTop && scrollTop > 100) {
                navbar.classList.add('navbar-hidden');
            } else {
                navbar.classList.remove('navbar-hidden');
            }
            lastScrollTop = scrollTop;
        });

        backToTopBtn.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Dark Mode Toggle (方案C：智能显示按�?
        const darkModeToggle = document.getElementById('darkModeToggle');
        const darkModeIcon = document.getElementById('darkModeIcon');
        const html = document.documentElement;

        // 检查用户是否有手动设置
        const savedTheme = localStorage.getItem('theme');
        const hasManualTheme = savedTheme !== null;

        function updateDarkModeUI(forceDark = null) {
            let isDark;
            
            if (forceDark !== null) {
                // 强制设置（用于点击切换）
                isDark = forceDark;
            } else {
                // 读取当前状�?
                isDark = html.getAttribute('data-bs-theme') === 'dark';
            }

            // 更新UI
            if (isDark) {
                html.setAttribute('data-bs-theme', 'dark');
                darkModeIcon.textContent = '☀�?;
                darkModeToggle.setAttribute('title', '当前：手动暗色（点击恢复系统自动�?);
            } else {
                html.removeAttribute('data-bs-theme');
                darkModeIcon.textContent = '🌙';
                darkModeToggle.setAttribute('title', '当前：跟随系统（点击切换手动暗色�?);
            }

            // 方案C：按钮显示逻辑
            if (hasManualTheme || forceDark === true) {
                // 用户有手动设置或刚切换到手动 �?显示按钮
                darkModeToggle.classList.add('visible');
            } else {
                // 系统自动模式 �?隐藏按钮
                darkModeToggle.classList.remove('visible');
            }
        }

        // 初始�?
        if (hasManualTheme) {
            // 有保存的设置，应用并显示按钮
            updateDarkModeUI(savedTheme === 'dark');
        } else {
            // 无设置，跟随系统，隐藏按�?
            updateDarkModeUI(false);
        }

        // 点击切换
        darkModeToggle.addEventListener('click', function() {
            const currentIsDark = html.getAttribute('data-bs-theme') === 'dark';
            const currentTheme = localStorage.getItem('theme');

            if (currentTheme !== null) {
                // 当前是手动模�?�?清除设置，恢复系统自�?
                localStorage.removeItem('theme');
                updateDarkModeUI(false);
            } else {
                // 当前是系统自�?�?切换到手动暗�?
                localStorage.setItem('theme', 'dark');
                updateDarkModeUI(true);
            }
        });

        // Update copyright year
        document.addEventListener('DOMContentLoaded', function() {
            const year = new Date().getFullYear();
            const copyright = document.querySelector('footer p.text-center.small');
            if (copyright) {
                copyright.innerHTML = `© ${year} 龙爪中国. All rights reserved.`;
            }

            // Load Git timeline
            loadTimeline();
        });

        // Git Timeline Loader
        async function loadTimeline() {
            const container = document.getElementById('auto-timeline');
            if (!container) return;

            try {
                const response = await fetch('timeline.json');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                const timeline = data.versions || [];

                if (timeline.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-4">
                            <p class="text-muted">暂无版本历史记录</p>
                        </div>`;
                    console.warn('⚠️ timeline.json 中没有版本记�?);
                    return;
                }

                // 生成时间轴HTML
                let html = '<div class="timeline">';
                timeline.forEach(v => {
                    html += `
                        <div class="timeline-item">
                            <div class="timeline-dot"></div>
                            <div class="timeline-content">
                                <h5>${v.version} · ${v.date}</h5>
                                <p class="text-muted mb-0">${v.title}</p>
                                <small class="text-muted">提交: ${v.commit}</small>
                            </div>
                        </div>`;
                });
                html += '</div>';

                // 添加"开发中"提示（保持原有结构）
                html += `
                    <div class="coming-soon">
                        <strong>🚧 正在开发：</strong> 龙形时间�?+ Git自动生成（即将上线）
                    </div>`;

                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `
                    <div class="alert alert-warning">
                        ⚠️ 无法加载发展史数�?
                    </div>`;
            }
        }
    </script>
